<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seedling Identifier</title>
<style>
:root{--bg:#eef3ec;--ink:#17301f;--muted:#5d7464;--panel:#fbfdf9;--line:#cfdccb;--crop:#2f7d4f;--weed:#b4572b;--focus:#1b5fb4}
@media(prefers-color-scheme:dark){:root{--bg:#0f1a13;--ink:#e3efe4;--muted:#93aa99;--panel:#16251b;--line:#2b4232;--crop:#5fc088;--weed:#e58a58;--focus:#7db3f5}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:880px;margin:0 auto;padding:clamp(20px,5vw,56px) 20px}
h1{font:600 clamp(2rem,6vw,3.4rem)/1.05 Georgia,"Iowan Old Style",serif;margin:0 0 10px;letter-spacing:-.01em}
.lead{color:var(--muted);max-width:52ch;margin:0 0 28px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
.drop{border:2px dashed var(--line);border-radius:18px;background:var(--panel);min-height:320px;display:grid;place-items:center;text-align:center;padding:20px;cursor:pointer;position:relative;overflow:hidden;transition:border-color .2s}
.drop.over{border-color:var(--crop)}
.drop:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.drop strong{display:block;font:600 1.15rem Georgia,serif}
.drop span{color:var(--muted);font-size:.92rem}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px;min-height:320px}
.verdict{font:600 clamp(1.6rem,4vw,2.2rem)/1.15 Georgia,serif;margin:0}
.tag{display:inline-block;margin:10px 0 18px;padding:3px 12px;border-radius:99px;color:#fff;font-size:.88rem;font-weight:600}
.tag.crop{background:var(--crop)}.tag.weed{background:var(--weed)}
.row{margin:12px 0}.row div{display:flex;justify-content:space-between;font-size:.95rem}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--crop);border-radius:6px;transition:width .6s ease}
.empty{color:var(--muted)}.err{color:var(--weed);font-weight:600}
footer{margin-top:28px;color:var(--muted);font-size:.9rem}
a{color:var(--crop)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <h1>What seedling is this?</h1>
  <p class="lead">Drop a photo of a young plant. The model tells you the species and whether it is a crop or a weed.</p>
  <div class="grid">
    <div class="drop" id="drop" tabindex="0" role="button" aria-label="Choose a seedling photo">
      <div id="hint"><strong>Drop a photo here</strong><span>or click to choose a PNG or JPG</span></div>
      <input id="file" type="file" accept="image/*" hidden>
    </div>
    <section class="panel" aria-live="polite" id="out"><p class="empty">Your result will appear here.</p></section>
  </div>
  <footer>Developers: <a href="/docs">API documentation</a> &middot; <a href="/classes">12 species</a> &middot; <a href="/health">status</a></footer>
</main>
<script>
const $=id=>document.getElementById(id),drop=$('drop'),file=$('file'),out=$('out');
drop.onclick=()=>file.click();
drop.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();file.click()}};
['dragover','dragenter'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.remove('over')}));
drop.addEventListener('drop',e=>run(e.dataTransfer.files[0]));
file.onchange=()=>run(file.files[0]);
async function run(f){
  if(!f)return;
  drop.querySelector('img')?.remove();
  const img=new Image();img.src=URL.createObjectURL(f);img.alt='Your uploaded photo';drop.append(img);$('hint').hidden=true;
  out.innerHTML='<p class="empty">Looking closely&hellip;</p>';
  const fd=new FormData();fd.append('file',f);
  try{
    const r=await fetch('/predict',{method:'POST',body:fd}),d=await r.json();
    if(!r.ok)throw new Error(d.detail||'Something went wrong.');
    out.innerHTML=`<p class="verdict">${d.prediction}</p>
      <span class="tag ${d.kind}">${d.kind==='crop'?'Crop':'Weed'} &middot; ${(d.confidence*100).toFixed(1)}% sure</span>
      ${d.top3.map(t=>`<div class="row"><div><span>${t.species}</span><span>${(t.probability*100).toFixed(1)}%</span></div><div class="bar"><i style="width:0" data-w="${t.probability*100}"></i></div></div>`).join('')}`;
    requestAnimationFrame(()=>requestAnimationFrame(()=>out.querySelectorAll('i').forEach(i=>i.style.width=i.dataset.w+'%')));
  }catch(e){out.innerHTML=`<p class="err">${e.message}</p><p class="empty">Try a different photo.</p>`}
}
</script>
</body>
</html>
